name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # MJCF parser tests use the Python standard library; previewing does not.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      # Upstream CAD/mesh files are fetched by hash; reuse verified downloads.
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: upstream-sources-${{ hashFiles('scripts/upstream-sources.json') }}
      - run: npm test
      - run: npm run release:check
